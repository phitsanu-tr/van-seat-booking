button { width: 100%; height: 52px; padding: 0 24px; border-radius: 16px; border: 2px solid #0e7c86; background: transparent; color: #0e7c86; font: 600 16px system-ui, "Noto Sans Thai", sans-serif; cursor: pointer; }

<script>
(function () {
  var UA = navigator.userAgent || "", q = new URLSearchParams(location.search), u = q.get("u") || "";

  } catch (e) {}
  document.getElementById("l").href = "https://line.me/R/msg/text/?" + encodeURIComponent(lead + "\n\n" + u);
  document.getElementById("c").onclick = function () {
    var b = this, d = function () { b.textContent = "คัดลอกแล้ว"; };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(u).then(d, function () {});
    else { var t = document.createElement("textarea"); t.value = u; document.body.appendChild(t); t.select(); try { document.execCommand("copy"); d(); } catch (e) {} t.remove(); }
  };
})();
