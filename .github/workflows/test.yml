# Runs the browser tests (tests/e2e, against a local fake-Redis dev server) on every push and pull request.
# A red X on a commit means a test failed: look at the "Run tests" step. Nothing here touches the live site or any secret.
name: tests
on:
  push:
  pull_request:
jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install test dependencies and Chromium
        run: |
          cd tests
          npm ci
          npx playwright install --with-deps chromium
      - name: Run tests
        run: node tests/run.js
      - name: Keep screenshots when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: tests/out
          retention-days: 7
