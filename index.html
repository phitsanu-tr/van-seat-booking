<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>จองที่นั่งรถตู้</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Prompt:wght@400;500;600&display=swap">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: one centered column. A line-drawn van floor plan (SVG, same proportions as the plan drawing) with HTML seat buttons laid over each seat box; booking bar sticks to the bottom; name list last. */
:root {
  --bg: #eef1f3;
  --paper: #ffffff;
  --surface: #ffffff;
  --ink: #1b1f22;
  --muted: #5f6b73;
  --line: #c9d2d8;
  --taken: #d9e0e5;
  --mine: #0e7c86;
  --mine-ink: #ffffff;
  --sel: #e08a00;
  --danger: #b3261e;
  --sky-a: #e1edf2;
  --sky-b: #bdd3de;
  --driver-ink: #d8344f;
  --font-display: "Prompt", "Noto Sans Thai", system-ui, sans-serif;
  --font-body: "Noto Sans Thai", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d151a; --paper: #131f26; --surface: #17252e; --ink: #e6ecef; --muted: #93a6b0; --line: #2d4350;
    --taken: #2a3c46; --mine: #3cc0cc; --mine-ink: #07262a; --sel: #f2a62b; --danger: #ff8a80;
    --sky-a: #2a4452; --sky-b: #1f3541; --driver-ink: #ff8fa0; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d151a; --paper: #131f26; --surface: #17252e; --ink: #e6ecef; --muted: #93a6b0; --line: #2d4350;
  --taken: #2a3c46; --mine: #3cc0cc; --mine-ink: #07262a; --sel: #f2a62b; --danger: #ff8a80;
  --sky-a: #2a4452; --sky-b: #1f3541; --driver-ink: #ff8fa0; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
header { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 1.2; margin: 0; text-wrap: balance; }
header.trip { display: block; }
.org { font-size: 13px; color: var(--mine); font-weight: 600; margin-bottom: 2px; }
.hero { --hbg: color-mix(in srgb, var(--mine) 10%, var(--surface)); display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--hbg); border-radius: 18px; padding: 16px 18px; }
.hero .ht { min-width: 0; }
.hero .org { margin: 4px 0 0; }
.hero h1 { font-size: 22px; overflow-wrap: anywhere; }
.hero .hv { flex: none; width: 76px; height: auto; }
.facts { margin: 12px 0 0; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; display: grid; gap: 8px; font-size: 14px; }
.facts div { display: flex; align-items: flex-start; gap: 10px; }
.facts svg { flex: none; width: 16px; height: 16px; color: var(--mine); margin-top: 3px; }
.facts dt { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.facts dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.vanbar { display: flex; flex-direction: column; gap: 8px; }
.vanbar .vrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.vanbar .count { margin-left: auto; }
.deck { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.tlbl { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px 0; font-size: 14px; color: var(--muted); }
.tlbl .tl { display: flex; align-items: center; gap: 6px; font-family: var(--font-display); font-weight: 600; }
.tlbl .tl svg { color: var(--mine); flex: none; }
.tlbl .tp { min-width: 0; text-align: right; overflow-wrap: anywhere; }
.tlbl .tp b { color: var(--ink); font-weight: 600; }
.deck .tabs { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; overflow: visible; padding: 10px 12px 12px; background: linear-gradient(color-mix(in srgb, var(--line) 60%, transparent), color-mix(in srgb, var(--line) 60%, transparent)) 14px 100% / calc(100% - 28px) 1px no-repeat; }
.deck .tabs .tab { flex-direction: column; gap: 0; line-height: 1.25; min-height: 52px; padding-block: 6px; }
.deck .tabs .tab small { margin-left: 0; font-size: 13px; }
.deck .tabs .tab .tn { font-size: 16px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.deck .tabs .tab { flex: none; width: calc((100% - 16px) / 3); }
@media (max-width: 350px) { .deck .tabs .tab small { font-size: 12.5px; } .deck .tabs { gap: 6px; padding-inline: 10px; } .deck .tabs .tab { width: calc((100% - 12px) / 3); } }
.deck .tabs .tab { padding: 0 6px; white-space: nowrap; display: flex; align-items: center; justify-content: center; }
.deck .sheet { border: 0; border-radius: 0; }
.deck .list { border: 0; border-radius: 0; }
.deck .vsw { background: none; border-radius: 0; padding: 0 12px; gap: 0; border-bottom: 1.5px solid var(--line); }
.deck .vsw button { border-radius: 0; border-bottom: 3px solid transparent; margin-bottom: -1.5px; min-height: 44px; }
.deck .vsw button[aria-selected="true"] { background: none; box-shadow: none; border-bottom-color: var(--mine); }
.shead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 8px 8px; }
.shead .count { margin-left: auto; }
.plate { font-size: 14px; line-height: 20px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.plate b { color: var(--ink); font-weight: 600; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.tabs .tab { flex: none; }
.tab { font: inherit; font-weight: 600; font-family: var(--font-display); font-size: 15px; min-height: 40px; padding: 0 14px; border-radius: 999px; cursor: pointer; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); }
.tab[aria-selected="true"] { background: var(--mine); border-color: var(--mine); color: var(--mine-ink); }
.tab small { font-weight: 500; opacity: .75; margin-left: 4px; font-size: 12px; }
.count { font-family: var(--font-display); font-size: 14px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.count b { color: var(--ink); font-size: 19px; font-weight: 600; }

.sheet { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 10px; }
.plan { position: relative; width: 100%; aspect-ratio: 820 / 1450; container-type: inline-size; }
.plan svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ln { fill: none; stroke: var(--ink); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.ln.bold { stroke-width: 7; }
.ln.thin { stroke-width: 1.4; opacity: .7; }
.ln.fillp { fill: var(--paper); }
.solid { fill: var(--ink); stroke: none; }
.lbl { fill: var(--muted); font-family: var(--font-body); font-size: 24px; letter-spacing: 2px; }
#overlay { position: absolute; inset: 0; }

.seat {
  position: absolute; font: inherit; color: var(--ink); background: transparent; border: 0; border-radius: 3px; padding: 9% 3% 0;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 3px; cursor: pointer; text-align: center; min-width: 0;
}
.seat .no { font-family: var(--font-display); font-weight: 500; font-size: 26px; font-size: clamp(18px, 6.4cqw, 30px); line-height: 1; }
.seat .who { font-size: 11.5px; font-size: clamp(10px, 3cqw, 13px); line-height: 1.2; font-weight: 500; overflow-wrap: anywhere; max-height: 2.45em; overflow: hidden; }
.seat:hover { background: color-mix(in srgb, var(--mine) 12%, transparent); }
.seat.taken { background: color-mix(in srgb, var(--taken) 94%, transparent); cursor: default; }
.seat.taken .no { color: var(--muted); }
.seat.mine { background: var(--mine); color: var(--mine-ink); cursor: pointer; }
.seat.mine .no { color: var(--mine-ink); }
.seat.sel { outline: 3px solid var(--sel); outline-offset: -2px; }
.seat:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid var(--sel); outline-offset: 1px; }
.driver {
  position: absolute; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(160deg, var(--sky-a), var(--sky-b)); color: var(--driver-ink);
  font-family: var(--font-display); font-weight: 500; font-size: 18px; font-size: clamp(14px, 5cqw, 24px);
}
.legend { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin: 4px 0 2px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; border: 1.5px solid var(--ink); vertical-align: -1px; margin-right: 5px; }
.legend .l-free { background: transparent; } .legend .l-taken { background: var(--taken); } .legend .l-mine { background: var(--mine); border-color: var(--mine); }

.backdrop {
  position: fixed; inset: 0; z-index: 20; background: rgba(8, 14, 18, .6); display: flex; align-items: center; justify-content: center;
  padding-top: max(16px, env(safe-area-inset-top, 0px)); padding-bottom: max(16px, env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.backdrop[hidden] { display: none !important; }
.modal {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px 18px; width: 100%; max-width: 340px;
  display: flex; flex-direction: column; gap: 14px; box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
}
.backdrop { align-items: flex-end; justify-content: center; padding: 0 !important; }
.modal { gap: 18px; padding: 12px 20px calc(24px + env(safe-area-inset-bottom, 0px)); border-radius: 26px 26px 0 0; max-width: 480px; border-bottom: 0; box-shadow: 0 -10px 40px rgba(0, 0, 0, .25); }
.modal::before { content: ""; align-self: center; width: 42px; height: 5px; border-radius: 3px; background: var(--line); }
.mhead { display: flex; gap: 16px; align-items: center; }
.mini { flex: none; width: 70px; border-radius: 12px; background: var(--bg); padding: 6px; box-sizing: border-box; display: flex; justify-content: center; }
.mini svg { width: 56px; height: 108px; display: block; }
.mtxt { display: flex; flex-direction: column; gap: 6px; min-width: 0; flex: 1; }
.mtxt small { font-size: 13px; color: var(--muted); }
.mtxt h2 { font-size: 28px !important; line-height: 1.1; }
.pill { align-self: flex-start; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: color-mix(in srgb, var(--mine) 18%, transparent); color: var(--mine); }
.pill.taken { background: var(--taken); color: var(--ink); }
.modal input[type=text] { flex: none; width: 100%; height: 58px; font-size: 18px; border: 2px solid var(--mine); border-radius: 16px; padding: 0 18px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--mine) 18%, transparent); outline: none; }
.modal .actions { flex-wrap: nowrap; gap: 10px; }
.modal .actions button { height: 56px; border-radius: 16px; font-size: 16px; padding: 0 16px; }
.modal .actions button.primary { flex: 1.6; font-size: 18px; }
.modal .actions button.plain { flex: 1; }
.modal .actions button.danger { flex: 1.6; }
.modal .actions button.ghost { flex: 1.6; align-self: auto; }
.modal h2 { font-family: var(--font-display); font-size: 20px; font-weight: 600; margin: 0; }
.modal p { margin: 0; color: var(--muted); }
.modal p b { color: var(--ink); font-weight: 600; }
.actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
button.plain { font: inherit; font-weight: 500; border-radius: 10px; padding: 10px 16px; cursor: pointer; background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
input[type=text] { flex: 1; min-width: 0; font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; }
button.primary, button.ghost { font: inherit; font-weight: 600; border-radius: 10px; padding: 10px 16px; cursor: pointer; border: 1.5px solid transparent; }
button.primary { background: var(--mine); color: var(--mine-ink); }
button.ghost { background: transparent; color: var(--danger); border-color: var(--danger); align-self: flex-start; }
button:disabled { opacity: .5; cursor: not-allowed; }
.msg { font-size: 13px; color: var(--danger); }
.msg:empty { display: none; }

.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.vsw { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: color-mix(in srgb, var(--ink) 9%, var(--bg)); }
.vsw button { font: inherit; font-family: var(--font-display); font-weight: 600; font-size: 15px; min-height: 42px; border: 0; border-radius: 11px; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.vsw button svg { width: 16px; height: 16px; flex: none; }
.vsw button[aria-selected="true"] { background: var(--surface); color: var(--mine); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
.vsw button:focus-visible { outline: 2px solid var(--mine); outline-offset: 2px; }
.list h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.list h2 small { font-family: var(--font-body); font-size: 12.5px; font-weight: 400; color: var(--muted); }
.list li.bk { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
.list li.bk .sn { flex: none; width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font: 600 14px var(--font-display); background: color-mix(in srgb, var(--ink) 7%, var(--surface)); font-variant-numeric: tabular-nums; }
.list li.bk .w { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; }
.list li.bk .me { flex: none; font-size: 11.5px; font-weight: 600; color: var(--mine); background: color-mix(in srgb, var(--mine) 14%, transparent); border-radius: 999px; padding: 2px 9px; }
.list li.mine-row { background: color-mix(in srgb, var(--mine) 8%, var(--surface)); }
.list li.mine-row .sn { background: var(--mine); color: var(--mine-ink); }
.list li.none, .list li.free { display: block; padding: 12px 16px; font-size: 13px; color: var(--muted); }
.list li.free b { color: var(--ink); font-weight: 600; margin-right: 6px; }
.list h2 { font-family: var(--font-display); font-size: 15px; font-weight: 500; margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.list ul { list-style: none; margin: 0; padding: 0; }
.list li { display: grid; grid-template-columns: 64px minmax(0, 1fr); padding: 8px 16px; border-bottom: 1px solid var(--line); gap: 8px; }
.list li:last-child { border-bottom: 0; }
.list li .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.list li .w { overflow-wrap: anywhere; }
.list li.empty .w { color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .seat { transition: background .15s; } }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  max-width: min(92vw, 360px); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 12px;
  font-size: 14px; text-align: center; box-shadow: 0 8px 28px rgba(0, 0, 0, .3);
}
.toast.error { background: var(--danger); color: var(--paper); }
.seat.pending { opacity: .6; }
button.danger { font: inherit; font-weight: 600; border-radius: 10px; padding: 10px 16px; cursor: pointer; background: var(--danger); color: var(--paper); border: 1.5px solid var(--danger); }
.foot { margin: 16px auto 0; text-align: center; font-size: 10px; line-height: 14px; color: var(--muted); white-space: nowrap; }
.foot a { color: inherit; text-decoration: none; }
.foot a:hover { text-decoration: underline; }
.foot svg { width: 10px; height: 10px; vertical-align: -1px; margin-right: 3px; fill: currentColor; }
</style>
</head>
<body>
<main>
  <header class="trip">
    <div class="hero"><div class="ht"><h1 id="tripName">จองที่นั่งรถตู้</h1>
    <div class="org" id="tripOrg" hidden></div></div><svg class="hv" viewBox="0 0 96 64" fill="none" aria-hidden="true"><path d="M4 58h88" stroke="var(--mine)" stroke-width="2.4" stroke-dasharray="1 6" stroke-linecap="round"/><g transform="translate(60 0)"><path d="M12 22s-8-6.5-8-12a8 8 0 1 1 16 0c0 5.5-8 12-8 12z" fill="var(--mine)"/><circle cx="12" cy="10" r="3" fill="var(--hbg)"/></g><g transform="translate(-2 3) scale(.82)"><path d="M6 41V21a6 6 0 0 1 6-6h44c3 0 5 1 7 3.2L75 30l8 2.2a6 6 0 0 1 5 5.8V41a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z" fill="var(--surface)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/><g fill="color-mix(in srgb,var(--mine) 25%,var(--surface))" stroke="var(--ink)" stroke-width="2.2" stroke-linejoin="round"><rect x="12" y="20" width="16" height="10" rx="2.5"/><rect x="32" y="20" width="16" height="10" rx="2.5"/><path d="M53 20h6.5c1.2 0 2 .4 2.8 1.3L67 28v2H53z"/></g><g fill="var(--ink)"><circle cx="26" cy="43" r="6.5"/><circle cx="70" cy="43" r="6.5"/></g><g fill="var(--surface)"><circle cx="26" cy="43" r="2.4"/><circle cx="70" cy="43" r="2.4"/></g></g></svg></div>
    <dl class="facts" id="tripFacts" hidden></dl>
  </header>

  <section class="deck">
  <div class="tlbl" id="tabLbl" hidden><span class="tl"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 16V8a2 2 0 012-2h9l5 4.5V16a1 1 0 01-1 1H4a1 1 0 01-1-1z"/><circle cx="8" cy="17.5" r="1.6"/><circle cx="16" cy="17.5" r="1.6"/></svg>เลือกรถตู้</span></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="เลือกคันรถ" hidden></div>

  <div class="vsw" id="viewSw" role="tablist" aria-label="เลือกมุมมอง">
    <button type="button" role="tab" id="swMap" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h6a3 3 0 013 3v6H7z"/><path d="M5 13h14v3a2 2 0 01-2 2H7a2 2 0 01-2-2z"/><path d="M8 18v2M16 18v2"/></svg>ผังที่นั่ง</button>
    <button type="button" role="tab" id="swList" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>รายชื่อผู้จอง</button>
  </div>

  <section class="sheet" id="sheetView" aria-label="ผังที่นั่งรถตู้">
    <div class="vrow shead"><div class="plate" id="plate" hidden></div><div class="count" id="count">จองแล้ว <b>0</b> / 10</div></div>
    <div class="plan">
      <svg viewBox="0 0 820 1450" aria-hidden="true" focusable="false">
        <!-- body -->
        <path class="ln bold" d="M75 1385 V160 Q75 62 205 46 Q410 22 615 46 Q745 62 745 160 V1385 Q745 1430 700 1430 H120 Q75 1430 75 1385 Z"/>
        <path class="ln thin" d="M92 1398 V165 Q92 98 215 74 Q410 50 605 74 Q728 98 732 165 V1398"/>
        <path class="ln" d="M95 152 Q410 70 727 152"/>
        <!-- mirrors -->
        <path class="ln fillp" d="M20 128 L75 120 L75 142 L24 144 Z"/>
        <path class="ln fillp" d="M745 120 L800 128 L796 144 L745 142 Z"/>
        <!-- steering wheel -->
        <circle class="ln" cx="615" cy="122" r="32" style="stroke-width:4"/>
        <circle class="solid" cx="615" cy="122" r="8"/>
        <path class="ln" d="M615 114 V92 M608 128 L588 140 M622 128 L642 140" style="stroke-width:6"/>
        <!-- wall pillars -->
        <rect class="solid" x="76" y="372" width="14" height="58"/>
        <rect class="solid" x="76" y="852" width="14" height="52"/>
        <rect class="solid" x="732" y="372" width="13" height="52"/>
        <rect class="solid" x="732" y="820" width="13" height="84"/>
        <!-- front row boxes -->
        <rect class="ln" x="110" y="185" width="202" height="182"/>
        <rect class="ln" x="312" y="185" width="160" height="182"/>
        <rect class="ln" x="514" y="185" width="202" height="182"/>
        <path class="ln thin" d="M110 318 H472 M514 318 H716"/>
        <!-- console -->
        <rect class="ln" x="90" y="372" width="230" height="86" rx="18"/>
        <rect class="ln" x="497" y="372" width="235" height="86" rx="18"/>
        <rect class="ln" x="322" y="372" width="170" height="86" rx="10"/>
        <rect class="ln" x="338" y="388" width="112" height="54" rx="6"/>
        <circle class="ln" cx="468" cy="403" r="9"/>
        <circle class="ln" cx="468" cy="433" r="9"/>
        <!-- wheel well -->
        <path class="ln" d="M92 486 L124 496 Q140 502 140 522 V800 Q140 826 120 832 L92 838"/>
        <!-- seat boxes -->
        <g class="ln">

<script>
(function () {
  var TOTAL = 10;
  var API = "/api/seats";
  // Seat boxes in the plan's own coordinate space (x, y, w, h in a 820 x 1450 drawing).
  var RECT = {
    1: [110, 185, 202, 182],
    4: [132, 550, 178, 183], 3: [312, 550, 200, 183], 2: [514, 550, 198, 183],
    7: [108, 857, 204, 183], 6: [352, 857, 180, 183], 5: [532, 857, 182, 183],
    10: [108, 1200, 204, 185], 9: [314, 1200, 198, 185], 8: [514, 1200, 200, 185]
  };
  var W = 820, H = 1450;

  var params = new URLSearchParams(location.search);
  var pathId = /^\/([a-hj-km-np-z2-9]{6,8})\/?$/.exec(location.pathname);
  var TRIP = (params.get("t") || (pathId && pathId[1]) || "default").toLowerCase();
  var trip = null;           // trip details from the server
  var curVan = params.get("v") || "";
  var vanCache = {};         // van id -> last seats seen
  var counts = {};
  var seats = {};            // n -> {name, at} for the van on screen
  var mineMap = {};          // n -> {at}: seats booked from this device (only used to tint them)
  var loaded = false, loadError = "";
  var selected = null, message = "", shown = false, confirming = false, lastSnapshot = "";
  var pending = 0, toastTimer = null, lastCounts = "", lastTrip = "";

  var overlayEl = document.getElementById("overlay");
  var panelEl = document.getElementById("panel");
  var backdropEl = document.getElementById("backdrop");
  var listEl = document.getElementById("list");
  var countEl = document.getElementById("count");
  var toastEl = document.getElementById("toast");

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function frame(node, r) {
    node.style.left = (r[0] / W * 100) + "%";
    node.style.top = (r[1] / H * 100) + "%";
    node.style.width = (r[2] / W * 100) + "%";
    node.style.height = (r[3] / H * 100) + "%";
    return node;
  }
  function savedName() { try { return localStorage.getItem("van-name") || ""; } catch (e) { return ""; } }
  function saveName(v) { try { localStorage.setItem("van-name", v); } catch (e) {} }
  // Seats booked from this device are remembered per trip and van (old single-van data lives under "van-mine").
  function mineKey() { return TRIP === "default" && curVan === "A" ? "van-mine" : "van-mine:" + TRIP + ":" + curVan; }
  function readMine() { try { return JSON.parse(localStorage.getItem(mineKey()) || "{}") || {}; } catch (e) { return {}; } }
  function saveMine() { try { localStorage.setItem(mineKey(), JSON.stringify(mineMap)); } catch (e) {} }
  function mine(n) { var s = seats[n], m = mineMap[n]; return !!(s && m && m.at === s.at); }

  async function api(method, body) {
    var url = API + "?t=" + encodeURIComponent(TRIP) + (curVan ? "&v=" + encodeURIComponent(curVan) : "");
    if (body) body = Object.assign({ t: TRIP, v: curVan }, body);
    var res = await fetch(url, {
      method: method,
      headers: { "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
      cache: "no-store"
    });
    var data = {};
    try { data = await res.json(); } catch (e) {}
    return { ok: res.ok, status: res.status, data: data };
  }

  function errorText(r, fallback) {
    var code = r && r.data && r.data.error;
    if (code === "taken") return "ที่นั่งนี้ถูกจองไปแล้ว เลือกที่นั่งอื่น";
    if (code === "bad_name") return "ใส่ชื่อก่อนจอง";
    if (code === "no_trip") return "ไม่พบทริปนี้ ตรวจสอบลิงก์อีกครั้ง";
    if (code === "no_van") return "ไม่พบรถคันนี้ รีเฟรชหน้าแล้วลองใหม่";
    if (code === "not_configured") return "ยังไม่ได้เชื่อมต่อฐานข้อมูล ติดต่อเจ้าของหน้า";
    return fallback;
  }

  function renderGrid() {
    overlayEl.textContent = "";
    overlayEl.appendChild(frame(el("div", "driver", "คนขับ"), [518, 189, 194, 174]));

    for (var n = 1; n <= TOTAL; n++) {
      (function (n) {
        var s = seats[n];
        var b = el("button", "seat");
        b.type = "button";
        b.appendChild(el("span", "no", String(n)));
        if (s) {
          b.classList.add("taken");
          if (mine(n)) b.classList.add("mine");
          if (s.pending) b.classList.add("pending");
          b.appendChild(el("span", "who", s.name));
          b.setAttribute("aria-label", "ที่นั่ง " + n + " จองโดย " + s.name);
        } else {
          b.setAttribute("aria-label", "ที่นั่ง " + n + " ว่าง");
        }
        if (selected === n) { b.classList.add("sel"); b.setAttribute("aria-pressed", "true"); }
        b.addEventListener("click", function () { selected = n; message = ""; confirming = false; renderAll(); });
        overlayEl.appendChild(frame(b, RECT[n]));
      })(n);
    }
  }

  function showToast(text, kind) {
    toastEl.textContent = text;
    toastEl.className = "toast" + (kind === "error" ? " error" : "");
    toastEl.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.hidden = true; }, kind === "error" ? 5000 : 3000);
  }

  function closeModal() { selected = null; message = ""; confirming = false; renderAll(); }

  function vanLabelNow() {
    if (!trip || trip.vans.length < 2) return "";
    var v = trip.vans.filter(function (x) { return x.id === curVan; })[0];
    return v ? "คัน " + v.label : "";
  }

  function miniSvg(sel, isTaken) {
    var out = '<svg viewBox="40 20 740 1440" aria-hidden="true"><path d="M75 1385 V160 Q75 62 205 46 Q410 22 615 46 Q745 62 745 160 V1385 Q745 1430 700 1430 H120 Q75 1430 75 1385 Z" fill="none" stroke="currentColor" stroke-width="22" stroke-linejoin="round" style="color:var(--ink)"/>';
    out += '<rect x="514" y="185" width="202" height="182" fill="var(--taken)" stroke="var(--line)" stroke-width="12"/>';
    for (var k in RECT) {
      var r = RECT[k], me = Number(k) === sel;
      var fill = me ? (isTaken ? "var(--ink)" : "var(--mine)") : (seats[k] ? "var(--taken)" : "var(--surface)");
      var stroke = me ? fill : "var(--line)";
      out += '<rect x="' + r[0] + '" y="' + r[1] + '" width="' + r[2] + '" height="' + r[3] + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="12"/>';
    }
    return out + '</svg>';
  }

  function renderPanel() {
    var keep = document.getElementById("nameInput");
    var typedName = keep ? keep.value : savedName();
    var hadFocus = !!keep && document.activeElement === keep;
    var opening = selected != null && !shown;
    shown = selected != null;
    backdropEl.hidden = selected == null;
    panelEl.textContent = "";
    if (selected == null) return;

    var n = selected, s = seats[n];
    if (!s) confirming = false;
    var head = el("div", "mhead");
    var mini = el("div", "mini");
    mini.innerHTML = miniSvg(n, !!s);
    head.appendChild(mini);
    var txt = el("div", "mtxt");
    txt.appendChild(el("small", null, (vanLabelNow() ? vanLabelNow() + " · " : "") + (s ? "ที่นั่งนี้" : "คุณกำลังจอง")));
    var title = el("h2", null, "ที่นั่ง " + n);
    title.id = "mTitle";
    txt.appendChild(title);
    txt.appendChild(el("span", s ? "pill taken" : "pill", s ? "จองแล้ว" : "ว่าง"));
    head.appendChild(txt);
    panelEl.appendChild(head);
    var actions = el("div", "actions");
    var input = null;

    function plainBtn(label, onClick) {
      var c = el("button", "plain", label);
      c.type = "button";
      c.addEventListener("click", onClick);
      return c;
    }

    if (!loaded) {
      panelEl.appendChild(el("p", null, loadError || "กำลังโหลดข้อมูลการจอง..."));
      actions.appendChild(plainBtn("ปิด", closeModal));
    } else if (s && confirming) {
      var ask = el("p", null, "ยกเลิกการจองของ ");
      ask.appendChild(el("b", null, s.name));
      ask.appendChild(document.createTextNode(" ที่ที่นั่ง " + n + " ใช่ไหม"));
      panelEl.appendChild(ask);
      actions.appendChild(plainBtn("ไม่ยกเลิก", function () { confirming = false; message = ""; renderPanel(); }));
      var sure = el("button", "danger", "ยืนยันยกเลิก");
      sure.type = "button";
      sure.addEventListener("click", function () { cancelSeat(n); });
      actions.appendChild(sure);
    } else if (s) {
      var info = el("p", null, "จองโดย ");
      info.appendChild(el("b", null, s.name));
      panelEl.appendChild(info);
      var cancel = el("button", "ghost", "ยกเลิกการจอง");
      cancel.type = "button";
      cancel.addEventListener("click", function () { confirming = true; message = ""; renderPanel(); });
      actions.appendChild(cancel);
      actions.appendChild(plainBtn("ปิด", closeModal));
    } else {
      input = el("input");
      input.type = "text"; input.id = "nameInput"; input.maxLength = 30;
      input.placeholder = "ชื่อหรือชื่อเล่น เช่น ต้น"; input.value = typedName;
      input.autocomplete = "off";
      input.setAttribute("aria-label", "ชื่อผู้จอง");
      input.addEventListener("keydown", function (e) { if (e.key === "Enter") book(n, input.value); });
      panelEl.appendChild(input);
      var ok = el("button", "primary", "OK");
      ok.type = "button";
      ok.addEventListener("click", function () { book(n, input.value); });
      actions.appendChild(plainBtn("ยกเลิก", closeModal));
      actions.appendChild(ok);
    }
    if (message) panelEl.appendChild(el("div", "msg", message));
    panelEl.appendChild(actions);
    if (input && hadFocus) input.focus();
  }

  var view = "map";
  try { view = sessionStorage.getItem("van-view") === "list" ? "list" : "map"; } catch (e) {}
  function setView(v) {
    view = v;
    try { sessionStorage.setItem("van-view", v); } catch (e) {}
    document.getElementById("sheetView").hidden = v !== "map";
    document.getElementById("listView").hidden = v !== "list";
    document.getElementById("swMap").setAttribute("aria-selected", v === "map" ? "true" : "false");
    document.getElementById("swList").setAttribute("aria-selected", v === "list" ? "true" : "false");
  }
  document.getElementById("swMap").addEventListener("click", function () { setView("map"); });
  document.getElementById("swList").addEventListener("click", function () { setView("list"); });
  setView(view);

  function renderList() {
    listEl.textContent = "";
    var booked = [], free = [];
    for (var n = 1; n <= TOTAL; n++) { if (seats[n]) booked.push(n); else free.push(n); }
    document.getElementById("listSub").textContent = loaded ? booked.length + " / " + TOTAL + " ที่นั่ง" : "";
    booked.forEach(function (n) {
      var m = mine(n);
      var li = el("li", "bk" + (m ? " mine-row" : ""));
      li.appendChild(el("span", "sn", String(n)));
      li.appendChild(el("span", "w", seats[n].name));
      if (m) li.appendChild(el("span", "me", "ที่นั่งของคุณ"));
      listEl.appendChild(li);
    });
    if (loaded && !booked.length) listEl.appendChild(el("li", "none", "ยังไม่มีผู้จอง"));
    if (loaded && booked.length && free.length) {
      var fl = el("li", "free"); fl.appendChild(el("b", null, "ที่นั่งว่าง")); fl.appendChild(document.createTextNode(free.join(" · "))); listEl.appendChild(fl);
    }
    if (loaded && !free.length) listEl.appendChild(el("li", "none", "เต็มแล้ว"));
    countEl.textContent = "";
    countEl.appendChild(document.createTextNode("จองแล้ว "));
    countEl.appendChild(el("b", null, loaded ? String(Object.keys(seats).length) : "-"));
    countEl.appendChild(document.createTextNode(" / " + TOTAL));
  }

  var MONTHS = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
  function parseD(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || "");
    return m ? { y: Number(m[1]) + 543, mo: Number(m[2]) - 1, d: Number(m[3]) } : null;
  }
  function dateRange(a, b) {
    var x = parseD(a), y = parseD(b);
    if (!x || !y || a === b) { var o = x || y; return o ? o.d + " " + MONTHS[o.mo] + " " + o.y : ""; }
    if (x.y === y.y && x.mo === y.mo) return x.d + " – " + y.d + " " + MONTHS[y.mo] + " " + y.y;
    if (x.y === y.y) return x.d + " " + MONTHS[x.mo] + " – " + y.d + " " + MONTHS[y.mo] + " " + y.y;
    return x.d + " " + MONTHS[x.mo] + " " + x.y + " – " + y.d + " " + MONTHS[y.mo] + " " + y.y;
  }
  function renderTrip() {
    var orgEl = document.getElementById("tripOrg"), nameEl = document.getElementById("tripName");
    var factsEl = document.getElementById("tripFacts"), tabsEl = document.getElementById("tabs");
    if (!trip) return;
    nameEl.textContent = trip.name;
    document.title = trip.name;
    orgEl.hidden = !trip.organizer; orgEl.textContent = trip.organizer || "";
    var rows = [];
    var dr = dateRange(trip.startDate, trip.endDate);
    var IC = {
      cal: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
      clk: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      van: '<path d="M3 16V8a2 2 0 012-2h9l5 4.5V16a1 1 0 01-1 1H4a1 1 0 01-1-1z"/><circle cx="8" cy="17.5" r="1.6"/><circle cx="16" cy="17.5" r="1.6"/>',
      pin: '<path d="M12 21s7-6 7-11a7 7 0 10-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>'
    };
    if (dr) rows.push(["วันที่", dr, "cal"]);
    if (trip.departTime) rows.push(["รถออก", trip.departTime.replace(":", ".") + " น.", "clk"]);
    if (trip.meetPoint) rows.push(["นัดพบ", trip.meetPoint, "pin"]);
    if (trip.vans.length) rows.push(["รถตู้", trip.vans.length + " คัน (" + trip.vans.length * TOTAL + " ที่นั่ง)", "van"]);
    factsEl.textContent = "";
    rows.forEach(function (r) {
      var d = el("div");
      var ns = "http://www.w3.org/2000/svg", sv = document.createElementNS(ns, "svg");
      sv.setAttribute("viewBox", "0 0 24 24"); sv.setAttribute("fill", "none"); sv.setAttribute("stroke", "currentColor");
      sv.setAttribute("stroke-width", "2"); sv.setAttribute("stroke-linecap", "round"); sv.setAttribute("stroke-linejoin", "round");
      sv.setAttribute("aria-hidden", "true"); sv.innerHTML = IC[r[2]]; d.appendChild(sv);
      d.appendChild(el("dt", null, r[0])); d.appendChild(el("dd", null, r[1])); factsEl.appendChild(d);
    });
    factsEl.hidden = rows.length === 0;
    var cur = trip.vans.filter(function (x) { return x.id === curVan; })[0] || trip.vans[0];
    var plateEl = document.getElementById("plate");
    var multi = trip.vans.length > 1;
    var lblEl = document.getElementById("tabLbl");
    plateEl.textContent = "";
    if (cur && cur.plate) { plateEl.appendChild(document.createTextNode("ทะเบียน ")); plateEl.appendChild(el("b", null, cur.plate)); }
    plateEl.hidden = !(cur && cur.plate);
    lblEl.hidden = !multi;
    tabsEl.textContent = "";
    tabsEl.hidden = trip.vans.length < 2;
    trip.vans.forEach(function (v) {
      var b = el("button", "tab");
      b.type = "button"; b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(v.id === curVan));
      var c = counts[v.id];
      b.appendChild(el("span", "tn", v.label));
      b.setAttribute("aria-label", "รถตู้ " + v.label + (c != null ? " " + (c >= TOTAL ? "เต็ม" : "ว่าง " + (TOTAL - c) + " ที่นั่ง") : ""));
      if (c != null) b.appendChild(el("small", null, c >= TOTAL ? "เต็ม" : "ว่าง " + (TOTAL - c)));
      b.addEventListener("click", function () { switchVan(v.id); });
      tabsEl.appendChild(b);
    });
  }
  function switchVan(id) {
    if (id === curVan || pending > 0) return;
    vanCache[curVan] = seats;
    curVan = id; selected = null; confirming = false; message = "";
    seats = vanCache[id] || {}; loaded = !!vanCache[id]; lastSnapshot = JSON.stringify(seats);
    mineMap = readMine();
    try { history.replaceState(null, "", location.pathname + "?" + new URLSearchParams(Object.assign({}, Object.fromEntries(params), { v: id })).toString()); } catch (e) {}
    renderAll(); refresh(true);
  }

  function renderAll() { renderTrip(); renderGrid(); renderPanel(); renderList(); }

  async function refresh(force) {
    if (pending > 0) return;
    try {
      var asked = curVan;
      var r = await api("GET");
      if (pending > 0 || asked !== curVan) return;
      if (!r.ok) {
        loadError = errorText(r, "โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชหน้า");
        if (!loaded) renderAll();
        return;
      }
      if (r.data && r.data.trip) {
        var firstLoad = !trip;
        trip = r.data.trip;
        if (!curVan || !trip.vans.some(function (v) { return v.id === curVan; })) curVan = r.data.van || trip.vans[0].id;
        if (firstLoad) mineMap = readMine();
      }
      counts = (r.data && r.data.counts) || counts;
      var next = {};
      var src = (r.data && r.data.seats) || {};
      Object.keys(src).forEach(function (k) {
        var n = Number(k);
        if (n >= 1 && n <= TOTAL && src[k] && src[k].name) next[n] = { name: String(src[k].name), at: src[k].at };
      });
      var snap = JSON.stringify(next);
      var changed = snap !== lastSnapshot || !loaded || JSON.stringify(counts) !== lastCounts || JSON.stringify(trip) !== lastTrip;
      lastCounts = JSON.stringify(counts); lastTrip = JSON.stringify(trip);
      seats = next; lastSnapshot = snap; loaded = true; loadError = "";
      if (changed || force) renderAll();
    } catch (e) {
      loadError = "เชื่อมต่อไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่";
      if (!loaded) renderAll();
    }
  }

  async function book(n, rawName) {
    var name = (rawName || "").trim().slice(0, 30);
    if (!name) { message = "ใส่ชื่อก่อนจอง"; renderPanel(); return; }
    saveName(name);
    // Show the name right away, then confirm with the server in the background.
    var temp = { name: name, at: "pending-" + Date.now(), pending: true };
    seats[n] = temp;
    selected = null; message = ""; confirming = false;
    pending++; renderAll();
    var failMsg = null;
    try {
      var r = await api("POST", { seat: n, name: name });
      if (r.ok) {
        if (seats[n] === temp) seats[n] = { name: name, at: r.data.at };
        mineMap[n] = { at: r.data.at };
        saveMine();
        showToast("บันทึกแล้ว ที่นั่ง " + n + " จองให้ " + name);
      } else if (r.data && r.data.error === "taken") {
        failMsg = "ที่นั่ง " + n + " ถูกจองไปแล้ว เลือกที่นั่งอื่น";
      } else {
        failMsg = errorText(r, "จองไม่สำเร็จ ลองอีกครั้ง");
      }
    } catch (e) {
      failMsg = "จองไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง";
    }
    if (failMsg) {
      if (seats[n] === temp) delete seats[n];
      showToast(failMsg, "error");
    }
    pending--; renderAll(); refresh(false);
  }

  async function cancelSeat(n) {
    var prev = seats[n];
    delete seats[n];
    selected = null; message = ""; confirming = false;
    pending++; renderAll();
    var failMsg = null;
    try {
      var r = await api("DELETE", { seat: n });
      if (r.ok) {
        delete mineMap[n];
        saveMine();
        showToast("ยกเลิกการจองที่นั่ง " + n + " แล้ว");
      } else {
        failMsg = errorText(r, "ยกเลิกไม่สำเร็จ ลองอีกครั้ง");
      }
    } catch (e) {
      failMsg = "ยกเลิกไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง";
    }
    if (failMsg) {
      if (prev && !seats[n]) seats[n] = prev;
      showToast(failMsg, "error");
    }
    pending--; renderAll(); refresh(false);
  }

  backdropEl.addEventListener("click", function (e) { if (e.target === backdropEl) closeModal(); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && selected != null) closeModal(); });
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") refresh(false); });
  setInterval(function () { if (document.visibilityState === "visible") refresh(false); }, 8000);

  renderAll();
  refresh(false);
})();
</script>
</body>
</html>
