<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>แพ็กเกจ · จองที่นั่งรถตู้</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Prompt:wght@400;500;600;700&display=swap">
<script>try{if(/\bLine\//i.test(navigator.userAgent))document.documentElement.classList.add("inline")}catch(e){}</script>
<style>
button { padding-top: 0; padding-bottom: 0; } /* drop the browser's 1px so every size stays even */
* { box-sizing: border-box; scrollbar-width: none; }
*::-webkit-scrollbar { display: none; }
[hidden] { display: none !important; }
:root {
  --ink: #1b1f22; --muted: #5f6b73; --line: #e8ecef; --mine: #0e7c86; --deep: #0b5f67; --tint: #e3f3f4;
  --amber: #b86e00; --amber-tint: #fdf0dd; --danger: #b3261e; --green: #068c3f;
  --font-display: "Prompt", "Noto Sans Thai", system-ui, sans-serif; --font-body: "Noto Sans Thai", system-ui, sans-serif; color-scheme: light;
}
html { touch-action: manipulation; }
body { margin: 0; background: #fff; color: var(--ink); font: 14px/20px var(--font-body); -webkit-tap-highlight-color: transparent; }
main { max-width: 460px; margin: 0 auto; padding: 12px 16px calc(32px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
.back { align-self: flex-start; display: inline-flex; align-items: center; gap: 2px; color: var(--deep); font: 600 16px/24px var(--font-display); text-decoration: none; }
.inline .back { display: none; }
.hd b { display: block; font: 700 26px/32px var(--font-display); }
.hd small { display: block; font-size: 14px; color: var(--muted); line-height: 20px}
.cur { border-radius: 24px; padding: 16px; color: #fff; background: linear-gradient(150deg, var(--mine), var(--deep)); display: flex; flex-direction: column; gap: 4px; }
.cur .k { font-size: 12px; color: #cfeaec; line-height: 16px}
.cur .t { font: 700 22px/30px var(--font-display); }
.cur .u { font-size: 14px; color: #d4ecee; line-height: 20px}
.cur .rw { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.cur .rw span { background: rgba(255,255,255,.14); border-radius: 12px; padding: 8px; font-size: 12px; color: #d9eff1; line-height: 16px}
.cur .rw b { display: block; font: 700 16px/24px var(--font-display); color: #fff; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: #f1f4f6; border-radius: 16px; padding: 4px; gap: 4px; }
.seg button { height: 40px; border: 0; border-radius: 12px; background: transparent; font: 600 14px/20px var(--font-display); color: var(--muted); cursor: pointer; }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.seg em { font-style: normal; font-size: 12px; color: var(--green); line-height: 16px}
.pl { border: 1.5px solid var(--line); border-radius: 16px; padding: 14px 16px; position: relative; display: flex; flex-direction: column; gap: 6px; }
.pl.rec { border-color: var(--mine); background: #f4fbfb; }
.pl .tag { position: absolute; top: -10px; right: 12px; background: var(--mine); color: #fff; font: 600 12px/16px var(--font-display); padding: 2px 10px; border-radius: 100px; }
.pl .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.pl .row b { font: 700 18px/26px var(--font-display); }
.pl .row span { font: 700 18px/26px var(--font-display); color: var(--deep); white-space: nowrap; }
.pl .row span small { font: 400 12px/16px var(--font-body); color: var(--muted); }
.pl .row .now { font: 600 12px/16px var(--font-body); color: var(--muted); }
.pl ul { margin: 0; padding: 0; list-style: none; font-size: 14px; color: #3b4449; line-height: 20px}
.pl li::before { content: "✓ "; color: var(--mine); font-weight: 700; }
.btn { height: 48px; border: 0; border-radius: 12px; width: 100%; background: linear-gradient(150deg, var(--mine), var(--deep)); color: #fff; font: 600 16px/24px var(--font-display); cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; }
.btn.w { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
.btn.sm { height: 40px; font-size: 14px; line-height: 20px}
.btn:disabled { opacity: .55; cursor: default; }
.pass { border-radius: 16px; padding: 14px 16px; background: linear-gradient(150deg, #fff6e8, #fdebd0); border: 1px solid #f5d9a8; color: #6b4a10; font-size: 14px; display: flex; flex-direction: column; gap: 8px; line-height: 20px}
.was { font-weight: 400; font-size: 14px; color: var(--muted); margin-right: 6px; line-height: 20px}
.promo { border-radius: 16px; padding: 12px 14px; background: #fdecef; color: #8a1f35; font-size: 14px; display: flex; flex-direction: column; line-height: 20px; text-wrap: pretty; }
.promo b { font: 700 16px/24px var(--font-display); }
.pass b { font: 700 16px/24px var(--font-display); color: #8a5400; }
.pass .btn { background: linear-gradient(150deg, #d48a12, var(--amber)); }
.note { font-size: 12px; color: var(--muted); text-align: center; line-height: 16px}
.box { border-radius: 24px; border: 1px solid var(--line); padding: 20px; display: flex; flex-direction: column; gap: 12px; align-items: center; text-align: center; }
.box .ic { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; background: var(--tint); line-height: 38px}
.box .ic.ok { background: #e8f8ee; color: var(--green); }
.box .ic.no { background: #fbe9e7; }
.box h2 { margin: 0; font: 700 20px/28px var(--font-display); }
.box p { margin: 0; color: #4a545a; font-size: 14px; line-height: 20px}
.spin { width: 28px; height: 28px; border: 3px solid var(--tint); border-top-color: var(--mine); border-radius: 50%; animation: sp 1s linear infinite; }
@keyframes sp { to { transform: rotate(360deg); } }
.fakeqr { width: 180px; height: 180px; border-radius: 16px; border: 1px solid var(--line); background: repeating-linear-gradient(90deg, #1b1f22 0 6px, #fff 6px 11px); position: relative; }
.fakeqr::after { content: "ทดสอบ"; position: absolute; inset: 70px 40px; background: #fff; border-radius: 8px; display: grid; place-items: center; font: 600 14px/20px var(--font-display); color: var(--amber); }
.h2 { font: 600 16px/24px var(--font-display); margin-top: 8px; }
.hist { border-radius: 16px; background: #f2f5f6; }
.hist div { display: flex; justify-content: space-between; gap: 8px; padding: 12px 14px; font-size: 14px; line-height: 20px}
.hist div + div { border-top: 1px solid #e3e8ea; }
.hist small { display: block; color: var(--muted); font-size: 12px; line-height: 16px}
details { border-radius: 16px; background: #f2f5f6; padding: 12px 14px; font-size: 14px; color: #3b4449; line-height: 20px}
details summary { font: 600 14px/20px var(--font-display); color: var(--ink); cursor: pointer; }
details ol { margin: 8px 0 0; padding-left: 18px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: #1b1f22; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 50; max-width: 90vw; line-height: 20px}
</style>
</head>
<body>
<script src="/bell.js"></script><script>VSBBell.bar("/mytrips#account");</script>
<main id="app">
  <div class="hd"><b id="title">แพ็กเกจ</b><small id="sub">ผู้จองที่นั่งใช้ฟรีเสมอ จ่ายเฉพาะคนจัดทริป</small></div>
  <div id="body"><div class="box"><div class="spin"></div></div></div>
</main>
<div class="toast" id="toast" hidden></div>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var MON = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
  function day(ms) { var d = new Date(ms + 7 * 3600e3); return d.getUTCDate() + " " + MON[d.getUTCMonth()] + " " + String((d.getUTCFullYear() + 543) % 100).padStart(2, "0"); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function baht(n) { return Number(n).toLocaleString("th-TH") + "฿"; }
  function toast(t) { var e = $("toast"); e.textContent = t; e.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(function () { e.hidden = true; }, 3200); }
  var q = new URLSearchParams(location.search);
  var NEXT = /^\/trips\/new(?:[?#][^\s]*)?$|^\/trips\/[a-z0-9]{6,8}$/.test(q.get("next") || "") ? q.get("next") : "";
  var yearly = false, S = null;

  function feats(t) {
    return [t.trips ? "สร้างทริปได้ " + t.trips + " ทริปต่อเดือน" : "สร้างทริปได้ไม่จำกัด", "รถสูงสุด " + t.vans + " คันต่อทริป", t.helpers ? "ผู้ช่วยจัด " + t.helpers + " คน" : "ไม่มีผู้ช่วยจัด", t.rounds ? "เช็กชื่อขึ้นรถ " + t.rounds + " รอบ" : "เช็กชื่อขึ้นรถไม่จำกัดรอบ"];
  }
  function buy(sku, btn) {
    if (S && !S.ready) { toast("ยังซื้อไม่ได้ตอนนี้ ระบบชำระเงินกำลังเชื่อมต่อ (Stripe)"); return; }
    btn.disabled = true;
    fetch("/api/pay", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ sku: sku }) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (x) {
        if (x.ok && x.d.url) { location.href = x.d.url + (x.d.url.indexOf("/plans") === 0 && NEXT ? "&next=" + encodeURIComponent(NEXT) : ""); return; }
        btn.disabled = false;
        toast({ pay_not_ready: "ระบบชำระเงินยังไม่เปิด ลองใหม่ภายหลัง", plans_off: "ยังไม่เปิดขายแพ็กเกจ", too_many: "ลองบ่อยเกินไป รอสักครู่" }[x.d.error] || "เริ่มการชำระเงินไม่สำเร็จ ลองอีกครั้ง");
      }).catch(function () { btn.disabled = false; toast("เชื่อมต่อไม่ได้ ลองอีกครั้ง"); });
  }

  function render() {
    var d = S, p = d.plan, body = $("body"); body.textContent = "";
    if (!d.on) { body.innerHTML = '<div class="box"><div class="ic">🎁</div><h2>ตอนนี้ใช้ได้ทุกอย่างฟรี</h2><p>ยังไม่เปิดขายแพ็กเกจ เมื่อเปิดจะแจ้งให้ทราบก่อน</p></div>'; return; }
    var wrap = document.createElement("div"); wrap.style.cssText = "display:flex;flex-direction:column;gap:12px";
    var T = d.tiers[p.tier] || d.tiers.free;
    var cur = '<div class="cur"><span class="k">แพ็กเกจของคุณ</span><span class="t">' + esc(T.name) + '</span><span class="u">' +
      (p.tier === "free" ? "ใช้ฟรี ไม่มีวันหมดอายุ" : "ใช้ได้ถึง " + day(p.until) + (p.src === "gift" ? " · ของขวัญสำหรับผู้ใช้เดิม" : "")) + '</span>' +
      '<div class="rw"><span><b>' + p.used + (T.trips ? "/" + T.trips : "") + '</b>ทริปเดือนนี้</span><span><b>' + T.vans + '</b>รถต่อทริป</span><span><b>' + p.passes + '</b>ตั๋วรายทริป</span></div></div>';
    wrap.insertAdjacentHTML("beforeend", cur);
    if (d.promoEnd) wrap.insertAdjacentHTML("beforeend", '<div class="promo"><b>🎉 ราคาเปิดตัว</b><span>ลดทุกแพ็กเกจ ถึง ' + day(d.promoEnd) + ' · ซื้อรายปีตอนนี้ ได้ราคาเปิดตัวทั้งปี</span></div>');
    if (!d.ready) wrap.insertAdjacentHTML("beforeend", '<div class="note" style="background:#fdf0dd;color:#8a5400;border-radius:12px;padding:8px 12px">⏳ ระบบชำระเงินยังไม่เปิด ตอนนี้ยังกดซื้อไม่ได้</div>');
    var seg = document.createElement("div"); seg.className = "seg";
    seg.innerHTML = '<button type="button" class="' + (yearly ? "" : "on") + '">รายเดือน</button><button type="button" class="' + (yearly ? "on" : "") + '">รายปี <em>ลด 2 เดือน</em></button>';
    seg.children[0].addEventListener("click", function () { yearly = false; render(); });
    seg.children[1].addEventListener("click", function () { yearly = true; render(); });
    wrap.appendChild(seg);
    var price = {}; d.catalog.forEach(function (c) { price[c.sku] = c; });
    [["free", null], ["standard", yearly ? "std_y" : "std_m"], ["premium", yearly ? "pre_y" : "pre_m"]].forEach(function (x) {
      var t = d.tiers[x[0]], c = x[1] && price[x[1]], card = document.createElement("div");
      card.className = "pl" + (x[0] === "standard" ? " rec" : "");
      var right = x[0] === p.tier ? '<span class="now">ใช้อยู่ตอนนี้</span>' : c ? "<span>" + (c.promo ? '<s class="was">' + baht(c.regular) + "</s>" : "") + baht(c.amount) + "<small>/" + (yearly ? "ปี" : "เดือน") + "</small></span>" : "<span>0฿</span>";
      card.innerHTML = (x[0] === "standard" ? '<span class="tag">คุ้มสุด</span>' : "") + '<div class="row"><b>' + t.name + "</b>" + right + "</div><ul>" + feats(t).map(function (f) { return "<li>" + f + "</li>"; }).join("") + "</ul>";
      if (c) {
        var bt = document.createElement("button"); bt.type = "button"; bt.className = "btn sm" + (x[0] === "standard" ? "" : " w");
        bt.textContent = x[0] === p.tier ? "ต่ออายุ " + c.label : "เลือก " + c.label;
        bt.addEventListener("click", function () { buy(c.sku, bt); }); card.appendChild(bt);
      }
      wrap.appendChild(card);
    });
    var ps = price.pass, pass = document.createElement("div"); pass.className = "pass"; pass.id = "pass";
    pass.innerHTML = "<b>🎟 ตั๋วรายทริป " + (ps.promo ? '<s class="was">' + baht(ps.regular) + "</s>" : "") + baht(ps.amount) + "</b><span>ปลดล็อกระดับ Standard ให้ทริปเดียว และไม่นับรวมกับโควตาทริปของเดือน ใช้ตอนสร้างทริป หรือกับทริปที่มีอยู่แล้วก็ได้" + (p.passes ? " · ตอนนี้มี " + p.passes + " ใบ" : "") + "</span>";
    var pb = document.createElement("button"); pb.type = "button"; pb.className = "btn sm"; pb.textContent = "ซื้อตั๋วรายทริป";
    pb.addEventListener("click", function () { buy("pass", pb); }); pass.appendChild(pb); wrap.appendChild(pass);
    wrap.insertAdjacentHTML("beforeend", '<div class="note">จ่ายด้วย PromptPay (สแกนจากแอปธนาคาร) หรือบัตร ผ่าน Stripe · ไม่ตัดเงินอัตโนมัติ หมดอายุแล้วซื้อต่อเองได้</div>');
    wrap.insertAdjacentHTML("beforeend", '<details><summary>เงื่อนไขและการคืนเงิน</summary><ol>' +
      "<li>แพ็กเกจรายเดือนใช้ได้ 30 วัน รายปี 365 วัน นับจากวันที่ชำระ ซื้อแพ็กเกจเดิมซ้ำจะต่อเวลาจากวันหมดอายุเดิม</li>" +
      "<li>อัปเกรดเป็นแพ็กเกจที่สูงกว่า แพ็กเกจใหม่เริ่มนับทันที</li>" +
      "<li>จำนวนทริปนับตามเดือน (เวลาไทย) ลบทริปแล้วไม่ได้โควตาคืน ยกเว้นลบภายใน 24 ชั่วโมงหลังสร้างและยังไม่มีใครจอง</li>" +
      "<li>เมื่อหมดอายุ ทริปและที่นั่งเดิมยังอยู่ครบ แต่จะสร้างทริป เพิ่มรถ หรือเพิ่มผู้ช่วยได้ตามสิทธิ์ของแพ็กเกจ Free</li>" +
      "<li>ตั๋วรายทริปไม่มีวันหมดอายุ ใช้แล้วผูกกับทริปนั้นถาวร</li>" +
      "<li>ราคาเปิดตัวใช้กับการซื้อที่ชำระภายในวันหมดโปรโมชั่น ซื้อหรือต่ออายุหลังจากนั้นใช้ราคาปกติ</li>" +
      "<li><b>การคืนเงิน</b> · ถูกตัดเงินซ้ำหรือระบบผิดพลาด: คืนเต็มทุกกรณี · ตั๋วรายทริปที่ยังไม่ได้ใช้กับทริปไหน: คืนได้ภายใน 30 วัน · แพ็กเกจรายเดือน/รายปี: คืนเต็มภายใน 7 วัน ถ้ายังไม่ได้สร้างทริปหรือใช้สิทธิ์เกินแพ็กเกจ Free · นอกจากนี้ไม่คืนเงิน (ไม่มีการตัดเงินต่ออัตโนมัติ)</li>" +
      "<li>ขอคืนเงิน: อีเมล phitsanu.tr@outlook.com พร้อมวันที่ชำระ · จ่ายด้วย PromptPay จะได้อีเมลจาก Stripe ขอเลขบัญชีที่ใช้จ่ายเพื่อโอนคืน · จ่ายด้วยบัตรคืนเข้าบัตร · เมื่อคืนเงินแล้ว สิทธิ์ของรายการนั้นจะถูกยกเลิก</li>" +
      "</ol></details>");
    body.appendChild(wrap);
    if (location.hash === "#pass") setTimeout(function () { pass.scrollIntoView({ block: "center" }); }, 50);
    fetch("/api/pay?orders=1", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (h) {
      if (!h.orders || !h.orders.length) return;
      var hs = '<div class="h2">ประวัติการชำระเงิน</div><div class="hist">' + h.orders.map(function (o) { return "<div><span>" + esc(o.label) + "<small>" + day(o.paidAt || o.at) + "</small></span><b>" + baht(o.amount) + "</b></div>"; }).join("") + "</div>";
      wrap.insertAdjacentHTML("beforeend", hs);
    }).catch(function () {});
  }

  function orderView(id) {
    $("title").textContent = "ชำระเงิน"; $("sub").textContent = "";
    var body = $("body"), tries = 0, dev = q.get("dev") === "1";
    function show(html) { body.innerHTML = '<div class="box">' + html + "</div>"; }
    function after() {
      var a = document.createElement("div"); a.style.cssText = "display:flex;flex-direction:column;gap:10px;width:100%";
      if (NEXT) { var n = document.createElement("a"); n.className = "btn"; n.href = NEXT; n.textContent = "กลับไปทำต่อ"; a.appendChild(n); }
      var m = document.createElement("a"); m.className = "btn" + (NEXT ? " w" : ""); m.href = "/mytrips"; m.textContent = "ไปหน้าแอป"; a.appendChild(m);
      body.firstChild.appendChild(a);
    }
    function poll() {
      fetch("/api/pay?order=" + encodeURIComponent(id), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
        var o = d.order;
        if (!o) { show('<div class="ic no">!</div><h2>ไม่พบรายการนี้</h2>'); after(); return; }
        if (o.status === "paid") {
          show('<div class="ic ok">✓</div><h2>ชำระเงินสำเร็จ</h2><p>' + esc(o.label) + " · " + baht(o.amount) + "</p><p>" + (d.plan && d.plan.tier !== "free" ? "ใช้ " + esc(d.plan.name) + " ได้ถึง " + day(d.plan.until) : "") + (o.sku === "pass" ? "ตอนนี้มีตั๋วรายทริป " + d.plan.passes + " ใบ" : "") + "</p>");
          after(); return;
        }
        if (o.status === "expired" || q.get("c") === "1") { show('<div class="ic no">✕</div><h2>ยังไม่ได้ชำระเงิน</h2><p>รายการนี้ยกเลิกหรือหมดเวลาแล้ว เลือกแพ็กเกจใหม่ได้เลย</p>'); var bk = document.createElement("a"); bk.className = "btn"; bk.href = "/plans" + (NEXT ? "?next=" + encodeURIComponent(NEXT) : ""); bk.textContent = "เลือกแพ็กเกจอีกครั้ง"; body.firstChild.appendChild(bk); return; }
        if (dev) {
          show('<div class="fakeqr"></div><h2>' + esc(o.label) + " · " + baht(o.amount) + '</h2><p>โหมดทดสอบในเครื่อง ไม่มีการตัดเงินจริง</p>');
          var go = document.createElement("button"); go.className = "btn"; go.type = "button"; go.textContent = "จำลองว่าจ่ายแล้ว";
          go.addEventListener("click", function () { go.disabled = true; fetch("/api/pay", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ order: id, devPaid: true }) }).then(function () { dev = false; poll(); }); });
          body.firstChild.appendChild(go); return;
        }
        show('<div class="spin"></div><h2>กำลังตรวจการชำระเงิน</h2><p>ถ้าจ่ายแล้ว รอสักครู่ ระบบจะเปิดสิทธิ์ให้เอง</p>');
        if (++tries < 40) setTimeout(poll, 3000); else { show('<div class="ic">⏳</div><h2>ยังไม่ได้รับการชำระ</h2><p>ถ้าตัดเงินแล้ว ระบบจะเปิดสิทธิ์ให้อัตโนมัติภายในไม่กี่นาที และแจ้งในกระดิ่ง</p>'); after(); }
      }).catch(function () { if (++tries < 40) setTimeout(poll, 3000); });
    }
    poll();
  }

  fetch("/api/pay", { cache: "no-store" }).then(function (r) {
    if (r.status === 401) { location.replace("/api/auth?start=1&r=" + encodeURIComponent(location.pathname + location.search)); return null; }
    return r.json();
  }).then(function (d) {
    if (!d) return;
    S = d;
    if (q.get("order")) orderView(q.get("order")); else render();
  }).catch(function () { $("body").innerHTML = '<div class="box"><h2>โหลดไม่สำเร็จ</h2><p>ลองรีเฟรชหน้า</p></div>'; });
})();
</script>
