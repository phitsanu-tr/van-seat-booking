<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Owner · จองที่นั่งรถตู้</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Prompt:wght@400;500;600&display=swap">
<style>
* { box-sizing: border-box; scrollbar-width: none; }
*::-webkit-scrollbar { display: none; }
html, body { overscroll-behavior: none; }
[hidden] { display: none !important; }
:root { --bg:#eef1f3; --surface:#fff; --ink:#1b1f22; --muted:#5f6b73; --line:#c9d2d8; --mine:#0e7c86; --mine-ink:#fff; --danger:#b3261e; --ok:#2e7d32;
  --font-display:"Prompt","Noto Sans Thai",system-ui,sans-serif; --font-body:"Noto Sans Thai",system-ui,sans-serif; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#0d151a; --surface:#17252e; --ink:#e6ecef; --muted:#93a6b0; --line:#2d4350; --mine:#3cc0cc; --mine-ink:#07262a; --danger:#ff8a80; --ok:#7fd48a; color-scheme: dark; } }
body { margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.5; padding:20px max(16px, env(safe-area-inset-left)) 48px; }
main { max-width:560px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
h1 { font:600 24px/1.2 var(--font-display); margin:0; }
p { margin:0; color:var(--muted); }
.card { background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px; display:flex; flex-direction:column; gap:10px; }
.top { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
.stat { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 12px; }
.stat b { display:block; font:600 22px/1.2 var(--font-display); }
.stat span { font-size:12.5px; color:var(--muted); }
input[type=password] { width:100%; height:48px; font:inherit; font-size:16px; color:var(--ink); background:var(--bg); border:1.5px solid var(--line); border-radius:12px; padding:0 14px; }
input:focus { outline:none; border-color:var(--mine); }
button { font:inherit; cursor:pointer; }
.btn { height:44px; border-radius:12px; font-weight:600; font-size:14px; border:1.5px solid transparent; padding:0 16px; }
.btn.primary { background:var(--mine); color:var(--mine-ink); }
.btn.plain { background:transparent; color:var(--ink); border-color:var(--line); }
.btn.danger { background:transparent; color:var(--danger); border-color:var(--danger); }
.btn.danger.sure { background:var(--danger); color:#fff; }
.name { font:600 17px/1.3 var(--font-display); overflow-wrap:anywhere; }
.meta { font-size:13px; color:var(--muted); overflow-wrap:anywhere; }
.meta a { color:var(--mine); text-decoration:none; font-weight:600; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }
.chip { font-size:12.5px; border:1px solid var(--line); border-radius:999px; padding:1px 10px; }
.chip.live { color:var(--ok); border-color:var(--ok); } .chip.end { color:var(--muted); }
.row { display:flex; gap:8px; align-items:center; justify-content:space-between; }
.msg { color:var(--danger); font-size:14px; } .msg:empty { display:none; }
</style>
</head>
<body>
<main>
  <div class="top"><h1>Owner</h1><button class="btn plain" id="out" hidden>ออก</button></div>

  <form class="card" id="keyForm" hidden autocomplete="off">
    <p>ใส่คีย์ผู้พัฒนา (OWNER_KEY)</p>
    <input type="password" id="key" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button class="btn primary" type="submit">เข้าสู่ระบบ</button>
  </form>

  <div id="app" hidden>
    <div class="stats">
      <div class="stat"><b id="sTrips">0</b><span>ทริป</span></div>
      <div class="stat"><b id="sLive">0</b><span>กำลังเปิด</span></div>
      <div class="stat"><b id="sBooked">0</b><span>ที่นั่งที่จอง</span></div>
    </div>
    <div class="row"><p id="note"></p><button class="btn plain" id="reload">รีเฟรช</button></div>
    <div id="list" style="display:flex;flex-direction:column;gap:14px"></div>
  </div>
  <div class="msg" id="msg" role="alert"></div>
</main>
<script>
(function () {
  "use strict";
  function $(id) { return document.getElementById(id); }
  var KEY = "";
  try { KEY = sessionStorage.getItem("van-owner") || ""; } catch (e) {}
  var h = (location.hash || "").slice(1);
  if (h) { KEY = decodeURIComponent(h); try { sessionStorage.setItem("van-owner", KEY); } catch (e) {} try { history.replaceState(null, "", location.pathname); } catch (e) {} }

  function say(t) { $("msg").textContent = t || ""; }
  function api(method, q) {
    return fetch("/api/owner" + (q || ""), { method: method, cache: "no-store", headers: { "x-owner-key": KEY } })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { status: r.status, body: j }; }); });
  }
  function showKey() { $("keyForm").hidden = false; $("app").hidden = true; $("out").hidden = true; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function fmtDate(t) { return t ? new Date(t + 7 * 3600e3).toISOString().slice(0, 16).replace("T", " ") : "-"; }

  function render(data) {
    var list = $("list"); list.textContent = "";
    var booked = 0, live = 0;
    data.trips.forEach(function (t) {
      booked += t.booked; if (!t.ended) live++;
      var c = el("div", "card");
      c.appendChild(el("div", "name", t.name || "(ไม่มีชื่อ)"));
      var m = el("div", "meta");
      var a = el("a", "", "/" + t.id); a.href = "/" + t.id; a.target = "_blank"; a.rel = "noopener";
      m.appendChild(a);
      m.appendChild(document.createTextNode("  ·  ผู้จัด: " + (t.organizer || "-") + "  ·  สร้าง " + fmtDate(t.createdAt) + (t.updatedAt && t.updatedAt !== t.createdAt ? "  ·  แก้ล่าสุด " + fmtDate(t.updatedAt) : "")));
      c.appendChild(m);
      c.appendChild(el("div", "meta", "วันที่: " + (t.startDate || "-") + (t.endDate && t.endDate !== t.startDate ? " – " + t.endDate : "") + (t.departTime ? "  ·  รถออก " + t.departTime : "")));
      var chips = el("div", "chips");
      chips.appendChild(el("span", "chip " + (t.ended ? "end" : "live"), t.ended ? "จบแล้ว" : "กำลังเปิด"));
      chips.appendChild(el("span", "chip", "จอง " + t.booked + " / " + t.total));
      t.vans.forEach(function (v) { chips.appendChild(el("span", "chip", v.label + ": " + v.n + "/10")); });
      c.appendChild(chips);
      var logBtn = el("button", "btn plain", "ดูประวัติจอง/ยกเลิก"); logBtn.type = "button";
      var logBox = el("div", "meta"); logBox.hidden = true;
      logBtn.addEventListener("click", function () {
        if (!logBox.hidden) { logBox.hidden = true; logBtn.textContent = "ดูประวัติจอง/ยกเลิก"; return; }
        logBtn.disabled = true;
        api("GET", "?log=" + encodeURIComponent(t.id)).then(function (r) {
          logBtn.disabled = false;
          if (r.status !== 200) { say("โหลดประวัติไม่สำเร็จ (" + (r.body.error || r.status) + ")"); return; }
          logBox.textContent = "";
          var ev = r.body.events || [];
          if (!ev.length) logBox.textContent = "ยังไม่มีประวัติ (เก็บเฉพาะหลังเริ่มบันทึก)";
          ev.forEach(function (x) {
            var who = x.d ? " · เครื่อง " + String(x.d).slice(0, 6) : "";
            var other = x.e === "cancel" && x.od && x.d && x.od !== x.d ? " · ยกเลิกโดยเครื่องอื่น" : "";
            logBox.appendChild(el("div", "", fmtDate(x.at) + "  " + (x.e === "book" ? "จอง" : "ยกเลิก") + " ที่นั่ง " + x.s + " (" + (x.v || "") + ") " + (x.n || "") + who + other));
          });
          logBox.hidden = false; logBtn.textContent = "ซ่อนประวัติ";
        });
      });
      c.appendChild(logBtn); c.appendChild(logBox);
      var del = el("button", "btn danger", "ลบทริปนี้"); del.type = "button";
      var armed = 0;
      del.addEventListener("click", function () {
        if (!armed) { armed = 1; del.textContent = "กดอีกครั้งเพื่อลบ (ลบการจองทั้งหมดด้วย)"; del.classList.add("sure"); setTimeout(function () { armed = 0; del.textContent = "ลบทริปนี้"; del.classList.remove("sure"); }, 4000); return; }
        del.disabled = true;
        api("DELETE", "?t=" + encodeURIComponent(t.id)).then(function (r) {
          if (r.status === 200) load(); else { del.disabled = false; say("ลบไม่สำเร็จ (" + (r.body.error || r.status) + ")"); }
        });
      });
      c.appendChild(del);
      list.appendChild(c);
    });
    $("sTrips").textContent = data.trips.length; $("sLive").textContent = live; $("sBooked").textContent = booked;
    $("note").textContent = data.trips.length ? "ใหม่สุดอยู่บน" + (data.truncated ? " · แสดงไม่ครบ (เกิน 1000)" : "") : "ยังไม่มีทริป";
  }

  function load() {
    say("");
    api("GET").then(function (r) {
      if (r.status === 200) { $("keyForm").hidden = true; $("app").hidden = false; $("out").hidden = false; render(r.body); return; }
      try { sessionStorage.removeItem("van-owner"); } catch (e) {}
      KEY = ""; showKey();
      say(r.status === 404 ? "ยังไม่ได้ตั้ง OWNER_KEY บนเซิร์ฟเวอร์" : r.status === 429 ? "ลองผิดหลายครั้ง รอสักครู่" : r.status === 403 ? "คีย์ไม่ถูกต้อง" : "เชื่อมต่อไม่สำเร็จ");
    }).catch(function () { say("เชื่อมต่อไม่สำเร็จ"); });
  }
  $("keyForm").addEventListener("submit", function (e) { e.preventDefault(); KEY = $("key").value.trim(); if (!KEY) return; try { sessionStorage.setItem("van-owner", KEY); } catch (x) {} $("key").value = ""; load(); });
  $("reload").addEventListener("click", load);
  $("out").addEventListener("click", function () { try { sessionStorage.removeItem("van-owner"); } catch (e) {} KEY = ""; showKey(); say(""); });
  window.addEventListener("hashchange", function () { location.reload(); });
  if (KEY) load(); else showKey();
})();
</script>
</body>
</html>
