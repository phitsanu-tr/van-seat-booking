<script>
(function(){
  var LIFF_ID = "2012285472-FvtYKx00";
  window.__liffReady = new Promise(function(resolve){
    var dg=function(c){try{navigator.sendBeacon("/api/auth",new Blob([JSON.stringify({diag:c})],{type:"application/json"}));}catch(e){}};
    if (!window.liff) { resolve(false); return; }
    liff.init({ liffId: LIFF_ID }).then(function(){
      if (!liff.isInClient()) {
        // opened from a chat link in LINE's plain in-app browser: hand over to the LIFF link once (never loops)
        try { if (/\bLine\//i.test(navigator.userAgent) && !sessionStorage.getItem("vsb_hand")) { sessionStorage.setItem("vsb_hand", "1"); location.replace("https://liff.line.me/" + LIFF_ID + location.pathname + location.search); return; } } catch (e) {}
        resolve(false); return;
      }
      document.documentElement.classList.add("in-line"); var vb = document.querySelector(".vb-bar"); if (vb) vb.style.display = "none"; // inside LINE: its own header already has the back button
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      // session cookie is HttpOnly, so ask the server whether we are signed in
      fetch("/api/auth?me=1", { cache: "no-store" }).then(function(r){ return r.json(); }).catch(function(){ return {}; }).then(function(me){
        if (me && me.user) { try { sessionStorage.removeItem("vsb_liff"); localStorage.removeItem("vsb_gone"); } catch (e) {} try { var rt = liff.getIDToken(); if (rt && !sessionStorage.getItem("vsb_rf")) { sessionStorage.setItem("vsb_rf", "1"); fetch("/api/auth", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ liff_token: rt, refresh: true }) }).then(function(r){ return r.json(); }).then(function(d){ if (d && d.changed) { try { localStorage.removeItem("vsb_me"); localStorage.removeItem("vsb_tb"); } catch (e) {} location.reload(); } }).catch(function(){}); } } catch (e) {}  /*LINE photo / name changed? the server takes the latest each time the app opens in LINE*/ resolve(true); return; }
        try { if (localStorage.getItem("vsb_gone")) { resolve(false); return; } } catch (e) {} // deleted my data on this device: no automatic sign-in until the person taps the button
        var tried = ""; try { tried = sessionStorage.getItem("vsb_liff"); } catch (e) {}
        var token = liff.getIDToken();
        if (tried || !token) { dg(tried ? "retry_blocked" : "no_token"); resolve(false); return; } // one try per tab: never loop
        try { sessionStorage.setItem("vsb_liff", "1"); } catch (e) {}
        fetch("/api/auth", { method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ liff_token: token, r: location.pathname + location.search + location.hash }) })
          .then(function(r){ return r.json(); })
          .then(function(d){ if (d && d.ok) location.replace(d.r || "/"); else { dg("login_" + ((d && d.error) || "fail")); resolve(false); } })
          .catch(function(){ dg("login_net"); resolve(false); });
      });
    }).catch(function(){ dg("init_fail"); resolve(false); });
  });
})();

<script>
(function () {
  var T = (location.pathname.match(/^\/([a-z0-9]+)\/queue/) || [])[1] || "";
  var main = document.getElementById("main"), D = null, busy = false; var draft = ""; // the names being typed survive a redraw
  document.getElementById("back").href = "/" + T + "/seats";

  function call(a, extra, onFail) {
    return fetch("/api/queue", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ t: T, a: a }, extra || {})) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (o) { if (o.ok && o.j && o.j.items) { D = o.j; draw(); } else { if (onFail) onFail(); flash((MSG[o.j && o.j.error]) || "ทำไม่สำเร็จ"); } })
      .catch(function () { if (onFail) onFail(); flash("เชื่อมต่อไม่ได้"); });
  }
  var errBox = null;

  function load() {
    if (busy) return Promise.resolve(); // an action is on its way: its answer redraws the page
    return fetch("/api/queue?t=" + encodeURIComponent(T), { cache: "no-store" }).then(function (r) {
      if (r.status === 404) { return r.json().then(function (j) { D = { off: j && j.error }; draw(); }); }
      return r.json().then(function (j) { D = j; draw(); });
    }).catch(function () {});
  }
  // ---- organizer view: status strip (tap to see who is next) + tabs รายชื่อ / ตั้งค่า, bar acts on the queue ----
  var ICN = { users: '<path d="M9 8m-3.5 0a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0-7 0M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/>', flag: '<path d="M5 21V4M5 4h11l-2 4 2 4H5"/>', check: '<path d="M5 12l5 5 9-10"/>' };
  function chead(icon, title, right) { // card header like the create-trip page: round icon + title (+ a note on the right)
    var h = el("div", "chd2"), ic = el("span", "ic"); ic.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICN[icon] + '</svg>';
    h.appendChild(ic); h.appendChild(el("h2", null, title)); if (right) h.appendChild(el("span", "r", right)); return h;
  }
  var tab = "list", stripOpen = false, menuId = "", sheet = "", draft = "";
  function turnRow() { return D.items.filter(function (i) { return i.id === D.turn; })[0]; }
  function waitingRows() { return D.items.filter(function (i) { return i.bound && !i.ok && !i.done; }); }
  function rowEl(it, i, menu) {
    var isT = D.turn === it.id, r = el("div", "row" + (it.done ? " done" : ""));
    r.appendChild(el("div", "no", String(i + 1)));
    var nm = el("div", "nm"); nm.appendChild(el("b", null, it.name));
    var sm = el("small"); if (it.lp) { var im = el("img"); im.src = it.lp; im.alt = ""; sm.appendChild(im); }
    sm.appendChild(el("span", null, it.bound ? "LINE: " + (it.ln || "") : "ยังไม่มีคนกดยืนยัน")); nm.appendChild(sm); r.appendChild(nm);
    if (it.bound && !it.ok && !it.done) r.appendChild(btn("อนุมัติ", "s", function () { return call("ok", { id: it.id, value: true }); }));
    else r.appendChild(el("span", "chip" + (isT ? " turn" : ""), it.done ? "เสร็จแล้ว" : isT ? "ถึงคิว" : "รอ"));

      d.addEventListener("click", function (e) { e.stopPropagation(); menuId = menuId === it.id ? "" : it.id; draw(); });

        var m = el("div", "menu"); m.setAttribute("role", "menu");
        var add = function (t, cls, fn) { var b = el("button", cls || "", t); b.type = "button"; b.addEventListener("click", function (e) { e.stopPropagation(); menuId = ""; if (busy) return; busy = true; fn().then(function () { busy = false; draw(); }, function () { busy = false; draw(); }); }); m.appendChild(b); };
        if (i > 0) add("เลื่อนขึ้น", "", function () { return call("up", { id: it.id }); });
        if (i < D.items.length - 1) add("เลื่อนลง", "", function () { return call("down", { id: it.id }); });
        if (it.bound) add("ปลดชื่อ", "", function () { return call("unbind", { id: it.id }); });
